name: Server distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOLO_AUTOINSTALL: "false"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify committed files
        run: python -m tools.verify_release
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchvision==0.29.2
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check local inference and configuration
        run: |
          python -m tools.verify_release --smoke
          python main.py --help
          python -m tools.setup_env
          docker compose config --quiet
