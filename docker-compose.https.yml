# Optional public HTTPS entry point. Include after docker-compose.web.yml.
services:
  web:
    environment:
      WEB_ALLOWED_HOSTS: ${WEB_DOMAIN:?Set WEB_DOMAIN to your real hostname},127.0.0.1,localhost
      WEB_CSRF_ORIGINS: https://${WEB_DOMAIN}
      WEB_SECURE_COOKIES: "1"
      WEB_REQUIRE_HTTPS: "1"
      WEB_TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}), timeout=3)"]
  caddy:
    image: caddy:2-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  caddy_data:
  caddy_config:
