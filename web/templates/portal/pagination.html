{% load console %}{% if page_obj %}<div class="pagination"><span>Всего записей: {{ page_obj.paginator.count|number }}</span><div>{% if page_obj.has_previous %}<a href="{% page_link page_obj.previous_page_number %}" class="button small secondary">← Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="{% page_link page_obj.next_page_number %}" class="button small secondary">Далее →</a>{% endif %}</div></div>{% endif %}
