<form method="get" class="filters" aria-label="Фильтры статистики">
  <div class="field"><label for="id_date_from">Дата с</label>{{ period_form.date_from }}</div>
  <div class="field"><label for="id_date_to">Дата по</label>{{ period_form.date_to }}</div>
  <div class="field field-bus"><label for="id_bus">Автобус</label><select name="bus" id="id_bus"><option value="">Все доступные автобусы</option>{% for bus in bus_choices %}<option value="{{ bus.bus_id }}" {% if filters.bus == bus.bus_id %}selected{% endif %}>{{ bus.name }} · {{ bus.bus_id }}</option>{% endfor %}</select></div>
  <div class="field"><label for="id_mode">Данные</label>{{ period_form.mode }}</div>
  <button class="button primary" type="submit">Применить</button>
  {% if nav == 'events' %}<input type="hidden" name="direction" value="{{ direction_filter }}"><input type="hidden" name="counted" value="{{ counted_filter }}">{% endif %}
</form>
{% if period_form.errors %}<div class="notice error" role="alert">{{ period_form.non_field_errors }}{% for field in period_form %}{{ field.errors }}{% endfor %}</div>{% endif %}
{% if data_error %}<div class="notice error" role="alert">{{ data_error }}</div>{% endif %}
